<!doctype html>
<meta charset="utf-8">
<title>Mili</title>
<style>
  :root { color-scheme: dark; --bg: #1f2128; --card: #2b2e38; --line: #3a3e4b; --ink: #eceef4; --dim: #9aa0b1; --accent: #ff7fa8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.4 "Segoe UI", system-ui, sans-serif; user-select: none; }
  body { padding: 14px; border: 1px solid var(--line); height: 100vh; overflow: hidden; }
  h1 { font-size: 15px; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; }
  h1 small { color: var(--dim); font-weight: 400; }
  .row { background: var(--card); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .row label { display: flex; justify-content: space-between; color: var(--dim); margin-bottom: 6px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  button { width: 100%; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; margin-bottom: 8px; font: inherit; text-align: left; cursor: pointer; display: flex; justify-content: space-between; }
  button:hover { border-color: var(--accent); }
  button.on { background: #4a2a3a; border-color: var(--accent); }
  button span { color: var(--dim); }
  button.danger:hover { border-color: #ff6b6b; }
  .hint { color: var(--dim); font-size: 11.5px; margin: 2px 2px 10px; }
</style>
<h1>Mili <small>v1.3</small></h1>

<div class="row"><label><span>Size</span><b id="sizeV">100%</b></label><input id="size" type="range" min="50" max="160" step="5" value="100"></div>

<button id="mic">Talk to her <span id="micV">Ctrl+Alt+M</span></button>
<button id="walk">Walk around <span id="walkV">on</span></button>
<button id="hide">Hide her <span id="hideV"></span></button>
<button id="learn">Explore my files now</button>
<button id="claude">Stop Claude Code jobs <span id="claudeV">Ctrl+Alt+C</span></button>
<p class="hint">Drag her to move her. Scroll over her to resize. Click her to type.</p>
<button id="quit" class="danger">Quit (keep services running)</button>
<button id="stop" class="danger">Quit and stop all services</button>

<script>
  const $ = (id) => document.getElementById(id);
  const render = (s) => {
    $('size').value = Math.round(s.scale * 100); $('sizeV').textContent = Math.round(s.scale * 100) + '%';
    $('walkV').textContent = s.walk ? 'on' : 'off'; $('walk').classList.toggle('on', s.walk);
    $('mic').classList.toggle('on', s.mic); $('micV').textContent = s.mic ? 'Listening... click to send' : 'Ctrl+Alt+M';
    $('claudeV').textContent = s.claude ? s.claude + ' running' : 'Ctrl+Alt+C'; $('claude').classList.toggle('on', s.claude > 0);
    $('hide').firstChild.textContent = s.hidden ? 'Show her ' : 'Hide her ';
  };
  panel.state().then(render);
  panel.onState(render);
  let t = 0;
  $('size').oninput = (e) => { $('sizeV').textContent = e.target.value + '%'; if (Date.now() - t > 60) { t = Date.now(); panel.cmd('scale', e.target.value / 100); } };
  $('size').onchange = (e) => panel.cmd('scale', e.target.value / 100);
  for (const k of ['mic', 'walk', 'hide', 'learn', 'claude', 'quit', 'stop']) $(k).onclick = () => panel.cmd(k);
</script>
